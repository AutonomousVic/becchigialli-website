<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Becchigialli - scena</title>
<style>
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#0b1a24;overscroll-behavior:none}
  /* the canvas holds the photo's own pixels and is stretched to the screen; its CSS size is set from JS */
  canvas{position:fixed;left:0;top:0;display:block;width:100%;height:100%;pointer-events:none}
  /* "Cambia il meteo", first version: the hour and the wind. The glass of the site's cards. */
  #hud{position:fixed;z-index:5;top:calc(var(--sa-t,0px) + 16px);right:calc(var(--sa-r,0px) + 16px);
       width:min(300px,calc(100vw - 32px - var(--sa-l,0px) - var(--sa-r,0px)));display:none;box-sizing:border-box;
       padding:14px 16px 16px;border-radius:14px;color:#eef2f8;font:13px/1.3 'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
       background:rgba(14,24,40,.52);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
       border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.35);text-shadow:0 1px 6px rgba(0,0,0,.4)}
  body.tools #hud{display:block}
  #hud .row{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2px;letter-spacing:.04em}
  #hud .row b{font-weight:500;font-variant-numeric:tabular-nums}
  #hud .row + input{margin-bottom:12px}#hud input:last-child{margin-bottom:0}
  #hud input{display:block;width:100%;height:28px;margin:0;background:none;accent-color:#FFBF00;touch-action:pan-x}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row"><span>Ora</span><b id="hv"></b></div><input id="hr" type="range" min="0" max="24" step="0.05" aria-label="Ora">
  <div class="row"><span>Vento</span><b id="wv"></b></div><input id="wd" type="range" min="0" max="18" step="0.5" aria-label="Vento">
  <div class="row"><span>Movimento</span><b id="mv"></b></div><input id="mo" type="range" min="0" max="150" step="5" aria-label="Movimento">
</div>
<script type="module">
/* The background of becchigialli.it: one photograph of the Paraggi cove, split into layers
   (sky, sea, foreground leaves, depth) and relit for the visitor's hour. Plain WebGL2. */

const QS = new URLSearchParams(location.search);
const EMBED = window.parent !== window;
const ORIGIN = window.origin || location.origin;   // 'null' inside a sandboxed frame
const IS_PHONE = matchMedia('(pointer: coarse)').matches;

function fail(reason){
  if (EMBED) window.parent.postMessage({type:'site:scene-error', reason: String(reason)}, '*');
  throw new Error(reason);
}

/* ---------- scene description (photo space: x right, y down, 0..1) ---------- */
const SCENE = {
  plate: 'img/plate.webp', w: 1086, h: 1200,
  horizonY: 373/1200,                 // the far shoreline
  focal: { landscape: [0.46, 0.42], portrait: [0.43, 0.5] },
  // the setting sun goes down over the far coast on the right; at dawn it rises behind the hill
  sunSet: [0.97, 0.20], sunRise: [0.15, 0.05],
  moon: [0.83, 0.235],
  // the camera found from the photo by tools/sea.py: a level horizon at row 373, a phone's lens,
  // 29 m above the water; and where the long swell travels on the water (x right, y away)
  camera: { f: 1170, cx: 543, cy: 600, pitch: 0.191636, height: 29 },
  swell: [-0.9536, 0.3011],
  // what floats (boxes in photo px, from tools/sea.py): swimmer, boat, buoy; and the boom's two ends
  objects: [[220, 967, 268, 996], [1016, 437, 1044, 451], [933, 484, 940, 490]],
  boom: [798, 623, 1066, 683]
};
// a photo pixel -> the direction the camera looks along it (x right, y away, z up)
function camRay(px, py){
  const c = SCENE.camera, u = (px - c.cx)/c.f, v = (py - c.cy)/c.f, cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  const d = [u, cp - v*sp, -(v*cp + sp)], n = Math.hypot(...d);
  return d.map(x => x/n);
}

// lit windows and lamps, in photo pixels: [x, y, radius px, kind] (0 warm window, 1 lamp, 2 far coast)
const LIGHT_PX = [
  // pink villa
  [241,335,3.2,0],[101,389,3.4,0],[157,392,3.2,0],[185,392,3.2,0],[213,392,3.2,0],[241,392,3.4,0],[280,392,2.8,0],
  [110,452,3.4,0],[180,450,3.4,0],[240,447,3.4,0],[276,440,2.6,0],[180,520,3.2,0],[130,522,3,0],
  // yellow villa
  [462,331,2.6,0],[480,331,2.6,0],[502,331,2.6,0],[537,329,3,0],[567,330,3,0],[675,332,2.8,0],
  [460,386,2.6,0],[500,386,2.8,0],[580,382,3,0],[612,384,3,0],[642,384,3,0],[675,382,3,0],[707,435,3,0],
  [470,440,3.6,0],[536,442,4,0],[580,440,3.4,0],[610,440,3.2,0],[630,440,3.2,0],[652,440,3.2,0],
  [470,487,3,0],[447,492,3,0],[732,500,2.8,0],
  // the small castle
  [375,500,2.8,0],[400,498,2.8,0],[450,547,3,0],[475,547,3,0],[412,557,3,0],[330,556,3.2,0],[362,556,3.2,0],
  // lamps along the path and on the tower
  [360,362,2.4,1],[594,160,2.2,1],[150,213,2,1],[780,494,2.2,1],[848,500,2.2,1]
];
// the far coast: a scatter of small lights along the shore and up the slopes
{
  let s = 20260929;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; };
  for (let i = 0; i < 34; i++){
    const x = 912 + rnd()*172;
    const up = rnd() < 0.25 ? 3 + rnd()*14 : rnd()*2;
    LIGHT_PX.push([x, 371 - up, 0.55 + rnd()*0.35, 2]);
  }
}

/* ---------- WebGL2 ---------- */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false,
                                        premultipliedAlpha:false, powerPreference:'default'});
if (!gl) fail('WebGL2 non disponibile');
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); stop('WebGL context lost'); });

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p*2.0 - 1.0, 0.0, 1.0); }`;

const LIGHT_SCALE = 1.6;   // the light map stores light/1.6, sRGB-encoded, so faint halos keep their precision
const FS = `#version 300 es
precision highp float;
uniform sampler2D uPlate, uMaps, uSky, uFill, uLights, uWaveA, uWaveB, uSeabed, uSea, uObjects;
uniform vec2 uRes, uImg, uOff, uVis;
uniform float uTime, uHorizonY;
// motion, already scaled by the wind and by "Movimento"
uniform float uStarTw;
uniform float uEV, uSat, uCon, uSkyMix, uNight, uStars, uCloud, uSunVis, uMoonVis, uLightsK, uGlint;
// the sea: the camera found from the photo, the waves, the lights it mirrors
uniform vec4 uCam;                  // focal length, principal point x and y (photo px), pitch (rad)
uniform float uCamH, uSeaT, uSpark; // camera height (m), the sea's own clock (s), daylight sparkle
uniform vec2 uAmp;                  // rms slope of the two wave textures
uniform vec4 uSwK; uniform vec2 uSwW; uniform float uSwA;   // the long swell: two waves
uniform vec3 uSunDir, uSunSpec, uMoonDir, uMoonSpec;
uniform float uWind;                // m/s
uniform vec4 uObjBox[3];            // swimmer, boat, buoy: photo px boxes
uniform vec4 uBoom;                 // the floating boom, from end to end (photo px)
uniform vec3 uWB, uZenith, uHorizon, uGlow, uSunCol, uLift;
uniform vec2 uSunPos, uMoonPos, uMoonPhase;
out vec4 oC;

float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float vhash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(vhash(i), vhash(i+vec2(1,0)), u.x), mix(vhash(i+vec2(0,1)), vhash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p, int oct){ float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ if (i >= oct) break; s += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; } return s; }
vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(max(c, vec3(0.0)), vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c)); }
const vec3 LUM = vec3(0.2126, 0.7152, 0.0722);

vec3 grade(vec3 c){
  c *= exp2(uEV + uWB);
  float l = dot(c, LUM);
  c = mix(vec3(l), c, uSat);
  c = max(c, 0.0);
  c = 0.18*pow(c/0.18 + 1e-5, vec3(uCon));
  c += uLift;
  // night vision: dim tones lose their colour and turn blue (as on vittoriodini.it)
  float l2 = dot(c, LUM);
  c = mix(c, l2*vec3(0.60, 0.76, 1.18), uNight*0.65*(1.0 - smoothstep(0.03, 0.6, l2)));
  return c;
}

vec3 drawnSky(vec2 p, float aspect){
  float t = clamp((uHorizonY - p.y)/uHorizonY, 0.0, 1.0);
  vec3 c = mix(uHorizon, uZenith, pow(t, 0.55));
  vec2 dv = (p - uSunPos)*vec2(aspect, 1.0);
  float r = length(dv);
  c += uGlow*(0.55*exp(-r*r/0.006) + 0.35*exp(-r/0.16))*uSunVis;
  return c;
}

// ---- the sea's geometry: the photo's camera, ~29 m above a flat sea (see tools/sea.py)
vec3 seaPoint(vec2 ip){              // photo pixel -> metres on the water (x right, y away), and the ray's length
  float u = (ip.x - uCam.y)/uCam.x, v = (ip.y - uCam.z)/uCam.x;
  float cp = cos(uCam.w), sp = sin(uCam.w);
  float down = v*cp + sp, fwd = cp - v*sp;
  float t = uCamH/max(down, 1e-4);
  return vec3(u*t, fwd*t, t*sqrt(1.0 + u*u + v*v));
}
vec2 dirToImg(vec3 d){               // a direction (x right, y away, z up) -> where the camera sees it, photo uv
  float cp = cos(uCam.w), sp = sin(uCam.w), down = -d.z;
  float zc = max(d.y*cp + down*sp, 1e-3), vc = -d.y*sp + down*cp;
  return vec2(uCam.y + uCam.x*d.x/zc, uCam.z + uCam.x*vc/zc)/uImg;
}
float fresnel(float c){ float m = 1.0 - clamp(c, 0.0, 1.0), m2 = m*m; return 0.02 + 0.98*m2*m2*m; }
float lobe(vec3 N, vec3 V, vec3 L, float r){   // a light's highlight on facets of rms slope r (Beckmann)
  vec3 H = normalize(L - V);
  float c = max(dot(N, H), 1e-3), c2 = c*c;
  return exp(-(1.0 - c2)/(c2*r*r))/(3.14159*r*r*c2*c2)*0.25/max(dot(N, -V), 0.05);
}
const float CAUSTIC = 0.45;
// the long swell's height (m) at a point of the sea, at a time
float swellH(vec2 X, float t){
  return uSwA*(cos(dot(uSwK.xy, X) - uSwW.x*t) + cos(dot(uSwK.zw, X) - uSwW.y*t + 1.7));
}
// how far up the rocks the last crests came: 0 calm .. 1 a crest right there; it drains away slowly
float surge(vec2 X, float lag){
  float a = clamp(swellH(X, uSeaT)/(2.0*uSwA), 0.0, 1.0);
  a = max(a, 0.8*clamp(swellH(X, uSeaT - lag)/(2.0*uSwA), 0.0, 1.0));
  return max(a, 0.6*clamp(swellH(X, uSeaT - 2.0*lag)/(2.0*uSwA), 0.0, 1.0));
}
const mat2 ROT = mat2(0.8253, 0.5646, -0.5646, 0.8253);    // the small waves turned 0.6 rad...
const mat2 ROT2 = mat2(0.6216, -0.7833, 0.7833, 0.6216);   // ...and again, -0.9 rad and smaller: their repeats never line up

// The water: the photo's own colour of the sea without its ripples (seabed: the floor, the shallows,
// the seagrass, the blue of the open sea), seen through a simulated surface that mirrors the sky and
// the sun. Where the surface is flat the colour is the seabed's; the waves only add what changes.
vec3 water(vec2 q, vec2 ip, vec3 sea, float expo, float aspect){
  vec3 P = seaPoint(ip);
  vec2 X = P.xy;
  vec3 V = normalize(vec3(X, -uCamH));
  vec4 A = texture(uWaveA, X/32.0);
  vec4 B = texture(uWaveB, ROT*X/4.0 + 0.37), B2 = texture(uWaveB, ROT2*X/2.9 + vec2(0.61, 0.13));
  vec2 sl = (A.rg - 0.5)*6.0*uAmp.x + (transpose(ROT)*(B.rg - 0.5) + transpose(ROT2)*(B2.rg - 0.5))*4.24*uAmp.y;
  float ph1 = dot(uSwK.xy, X) - uSwW.x*uSeaT, ph2 = dot(uSwK.zw, X) - uSwW.y*uSeaT + 1.7;
  sl -= uSwA*(uSwK.xy*sin(ph1) + uSwK.zw*sin(ph2));
  // far out the textures' mipmaps smooth the waves away: what is lost becomes roughness, so the
  // sun still finds a broad path of glints there
  // how much of each texture's waves are smaller than two pixels here (each holds the same slope
  // in every octave of size: A 1-10 m, B 0.25-1.2 m)
  float fm = 2.0*sqrt(length(dFdx(X))*length(dFdy(X)));     // metres: the smallest wave a pixel pair shows
  float lostA = clamp(log2(fm/1.0)/3.32, 0.0, 1.0), lostB = clamp(log2(fm/0.25)/2.26, 0.0, 1.0);
  float rough = sqrt(0.0009 + uAmp.x*uAmp.x*lostA + uAmp.y*uAmp.y*lostB);
  vec3 N = normalize(vec3(-sl, 1.0));
  // the sky each facet mirrors, against the facet tilted the other way: the light and dark the waves
  // make, with nothing added on average (that is already in the photo's colour)
  float F = fresnel(dot(-V, N)), F0 = 0.5*(F + fresnel(dot(-V, normalize(vec3(sl, 1.0)))));
  vec3 Rf = reflect(V, N); Rf.z = abs(Rf.z);
  vec2 qr = dirToImg(Rf);
  qr.y = min(qr.y, uHorizonY - 0.003);
  vec3 skyR = mix(grade(texture(uFill, clamp(qr, vec2(0.001), vec2(0.999))).rgb), drawnSky(qr, aspect), uSkyMix);
  // the floor, shifted by the refraction through the moving surface (more where the water is
  // deeper, less far away), and the light the small waves focus on it in the shallows
  float depth = sea.g, dm = 0.5 + 6.0*depth;
  float pxm = uCam.x/P.z;                                  // photo pixels per metre, there
  vec2 dq = vec2(sl.x, sl.y*V.z)*dm*0.25*pxm/uImg;
  vec3 bed = texture(uSeabed, q + dq).rgb;
  // the sunlight the small waves focus on the floor: a moving net of light, sharp where the
  // surface curves enough to bring it to a focus at that depth (most of the cove shows its floor)
  float floorK = (1.0 - smoothstep(0.35, 0.9, depth))*uGlint*(1.0 - lostB)*clamp(uAmp.y/0.09, 0.3, 1.5);
  vec2 Xf = X + sl*dm*0.25;
  float lap = (texture(uWaveB, ROT*Xf/4.0 + 0.37).a + texture(uWaveB, ROT2*Xf/2.9 + vec2(0.61, 0.13)).a - 1.0)*4.24;
  // thin bright lines where the curvature changes sign (the focus lines), on an untouched floor:
  // never a dark net
  float caus = exp(-lap*lap/0.06);
  bed *= 1.0 + floorK*CAUSTIC*(caus - 0.16);
  vec3 body = grade(bed);
  // (softened where it is large, out at the slant, so the long waves do not stripe the sea black)
  float dF = F - F0; dF /= 1.0 + 4.0*abs(dF);
  // a facet turned towards the camera shows the water with less sky in it, but the photo's colour
  // is already that water seen through a calm surface: darken it only gently, or the clear
  // shallows fill with black specks
  dF = dF > 0.0 ? dF : 0.3*dF;
  vec3 col = body + dF*(skyR - body);
  // at dusk and at night the sea mirrors a sky that is not the photo's: the difference, on average
  vec2 qf = dirToImg(vec3(V.xy, -V.z)); qf.y = min(qf.y, uHorizonY - 0.003);
  col += fresnel(-V.z)*uSkyMix*(drawnSky(qf, aspect) - grade(texture(uFill, clamp(qf, vec2(0.001), vec2(0.999))).rgb));
  // the sun and the moon on the water; in daylight the steepest crests catch the sky too
  col += (uSunSpec*lobe(N, V, uSunDir, rough) + uMoonSpec*lobe(N, V, uMoonDir, rough + 0.02))*F;
  float crest = (B.b + B2.b - 1.0)*4.24 + 0.4*(A.b - 0.5)*6.0;
  col += uSpark*smoothstep(2.7, 3.6, crest)*(1.0 - lostB)*clamp(uAmp.y/0.09, 0.4, 1.6);

  // ---- the swell on the rocks. As a crest reaches a stretch of shore the water climbs it and
  // leaves a lace of foam that spreads a little way out and drains back; the rocks the swell meets
  // head on get the most (expo). A thin line of froth always laps at the waterline. With a strong
  // wind there is more of it, and the steepest crests out at sea break white.
  float dShore = max((sea.b*255.0 - 128.0)*0.5, 0.0)/pxm;            // metres from the rock
  float up = surge(X, 1.5);
  float reach = (0.8 + 0.2*uWind)*(0.25 + 0.75*up)*(0.4 + 0.6*expo);
  // only some stretches of shore at a time: the crest breaks here, not there (no outline)
  float patchK = smoothstep(0.45, 0.75, vnoise(X*0.32 + vec2(0.035, -0.02)*uSeaT));
  float dens = exp(-dShore/max(reach*(0.6 + 0.8*patchK), 0.05))*(0.15 + 0.85*expo)*pow(up, 1.5)*patchK;
  float lace = 0.5*(B.b + B2.b) + 0.5*vnoise(X*2.6 + vec2(0.11, 0.07)*uSeaT) + 0.25*(vnoise(X*7.0 - 0.2*uSeaT) - 0.5);
  float foam = clamp(dens*3.0, 0.0, 1.0)*smoothstep(0.6 - 0.15*dens, 0.78 - 0.15*dens, lace);
  foam += smoothstep(2.4, 3.2, (A.b - 0.5)*6.0 + 0.6*(B.b - 0.5)*6.0)*smoothstep(7.0, 14.0, uWind)*(1.0 - lostA)*0.7;
  col = mix(col, grade(vec3(0.80, 0.84, 0.86)), clamp(foam, 0.0, 1.0)*0.9);
  return max(col, 0.0);
}

void main(){
  // the camera does not move: a screen pixel is a photo pixel, nothing else
  vec2 s = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y)/uRes;
  vec2 q = uOff + s*uVis;
  float aspect = uImg.x/uImg.y;
  vec4 m = texture(uMaps, q);
  vec2 ip = q*uImg;

  vec3 c = texture(uPlate, q).rgb;

  float alpha = texture(uSky, q).r;
  vec3 land = c;
  if (alpha > 0.002){
    vec3 fill = texture(uFill, q).rgb;
    land = clamp((c - alpha*fill)/max(1.0 - alpha, 0.12), 0.0, 1.0);
  }
  vec3 sea = texture(uSea, q).rgb;               // water, depth, distance to the shore
  // the rock just above the waterline: wet, darker and a little glossy, where the swell has climbed;
  // it dries again slowly
  float dLand = (sea.b*255.0 - 128.0)*0.5;
  if (dLand < 0.0 && dLand > -16.0 && m.b > 0.01){
    vec3 Pw = seaPoint(ip);
    float wet = m.b*smoothstep((0.3 + 0.08*uWind)*(0.45 + 0.55*surge(Pw.xy, 2.5)), 0.0, -dLand*Pw.z/uCam.x);
    land *= 1.0 - 0.32*wet;
  }
  vec3 col = grade(land);

  // ---- the sea, then what floats on it (rising and falling with the swell); the leaves come after, drawn on top
  if (sea.r > 0.004){
    col = mix(col, water(q, ip, sea, m.b, aspect), sea.r);
    vec2 qo = q;
    for (int i = 0; i < 3; i++){
      vec4 bx = uObjBox[i];
      if (ip.x > bx.x - 4.0 && ip.x < bx.z + 4.0 && ip.y > bx.y - 16.0 && ip.y < bx.w + 16.0){
        vec3 Pa = seaPoint(vec2(0.5*(bx.x + bx.z), bx.w));
        qo.y += swellH(Pa.xy, uSeaT)*0.9*uCam.x/Pa.z/uImg.y;
      }
    }
    vec2 bd = uBoom.zw - uBoom.xy;
    float bt = clamp((ip.x - uBoom.x)/bd.x, 0.0, 1.0);
    vec2 bp = uBoom.xy + bd*bt;
    if (abs(ip.y - bp.y) < 16.0 && ip.x > uBoom.x - 4.0 && ip.x < uBoom.z + 4.0){
      vec3 Pb = seaPoint(bp);
      qo.y += swellH(Pb.xy, uSeaT)*0.9*uCam.x/Pb.z/uImg.y;
    }
    vec4 ob = texture(uObjects, qo);
    col = mix(col, grade(ob.rgb), ob.a);
  }

  // ---- sky, only where there is sky: the photo's own by day, a drawn one with sun, moon and stars
  // at dusk and at night
  if (alpha > 0.002){
    float as = texture(uSky, q).r;
    vec3 plate = mix(texture(uFill, q).rgb, c, smoothstep(0.9, 1.0, as));
    vec3 sky = mix(grade(plate), drawnSky(q, aspect), uSkyMix);
    // thin clouds drifting across
    vec2 cq = vec2(q.x*2.6 - uTime*0.0035, q.y*8.0);
    float cl = uCloud > 0.01 ? smoothstep(0.58 - 0.25*uCloud, 0.92, fbm(cq + fbm(cq*0.7, 3), 5))*uCloud : 0.0;
    vec3 cloudCol = mix(uZenith*1.6 + uHorizon*0.25, uHorizon*0.9 + uGlow*0.8, clamp(uSkyMix*1.2, 0.0, 1.0));
    cloudCol = mix(grade(vec3(0.85, 0.88, 0.9)), cloudCol, uSkyMix);
    if (uStars > 0.001){
      vec2 sp = ip, sc = floor(sp/5.0);
      float sh1 = h12(sc);
      if (sh1 < 0.05){
        vec2 so = (sc + 0.2 + 0.6*vec2(h12(sc + 7.1), h12(sc + 3.7)))*5.0;
        float rr = length(sp - so);

  [ 22,  0.00, [ 0.03, 0.01,-0.03], 1.00, 1.00, 0.00, [ 70,105,150], [205,212,215], [  0,  0,  0]],
  [ 12, -0.10, [ 0.12, 0.03,-0.12], 1.04, 1.02, 0.10, [ 64, 96,140], [225,205,170], [ 60, 35, 10]],
  [  6, -0.35, [ 0.26, 0.04,-0.28], 1.10, 1.04, 0.45, [ 55, 80,125], [240,180,110], [140, 70, 20]],
  [  2, -0.80, [ 0.38, 0.00,-0.42], 1.06, 1.05, 0.80, [ 48, 65,110], [245,150, 80], [190, 80, 25]],
  [ -1, -1.35, [ 0.34,-0.05,-0.30], 0.95, 1.04, 0.95, [ 42, 52, 95], [230,120, 75], [150, 55, 25]],
  [ -4, -2.10, [ 0.02,-0.08, 0.10], 0.82, 1.00, 1.00, [ 28, 36, 78], [165, 95, 90], [ 60, 25, 20]],
  [ -7, -2.85, [-0.22,-0.08, 0.32], 0.68, 0.96, 1.00, [ 14, 22, 52], [ 80, 62, 88], [ 15,  5,  5]],
  [-12, -3.80, [-0.35,-0.10, 0.45], 0.45, 0.92, 1.00, [  5, 11, 26], [ 18, 24, 42], [  0,  0,  0]],
  [-30, -4.20, [-0.38,-0.10, 0.48], 0.35, 0.90, 1.00, [  3,  8, 19], [ 10, 15, 28], [  0,  0,  0]]
];
// dawn: cooler, pinker
const K_RISE = K_SET.map(r => r.slice());
K_RISE[3] = [  6, -0.30, [ 0.16, 0.03,-0.12], 1.05, 1.03, 0.45, [ 70, 92,140], [235,190,160], [120, 70, 60]];
K_RISE[4] = [  2, -0.70, [ 0.22, 0.00,-0.15], 1.00, 1.03, 0.80, [ 60, 78,125], [240,165,150], [170, 85, 70]];
K_RISE[5] = [ -1, -1.25, [ 0.14,-0.04,-0.02], 0.92, 1.02, 0.95, [ 48, 60,110], [215,140,140], [110, 55, 55]];
K_RISE[6] = [ -4, -2.00, [-0.05,-0.07, 0.18], 0.80, 1.00, 1.00, [ 30, 40, 85], [150,110,130], [ 40, 20, 25]];

const lin = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v + 0.055)/1.055, 2.4); };
const linRGB = a => a.map(lin);
const mix = (a, b, f) => a + (b - a)*f;
const mix3 = (a, b, f) => [0, 1, 2].map(i => mix(a[i], b[i], f));
function keyAt(K, el){
  if (el >= K[0][0]) return K[0];
  for (let i = 1; i < K.length; i++){
    if (el >= K[i][0]){
      const a = K[i], b = K[i - 1], f = (el - a[0])/(b[0] - a[0]);
      return [el, mix(a[1], b[1], f), mix3(a[2], b[2], f), mix(a[3], b[3], f), mix(a[4], b[4], f), mix(a[5], b[5], f),
              mix3(linRGB(a[6]), linRGB(b[6]), f).map(x => x*255), mix3(linRGB(a[7]), linRGB(b[7]), f).map(x => x*255),
              mix3(linRGB(a[8]), linRGB(b[8]), f).map(x => x*255), true];
    }
  }

}
function toLin(row){ return row[9] ? row.map((v, i) => i >= 6 && i <= 8 ? v.map(x => x/255) : v) :
                                     row.map((v, i) => i >= 6 && i <= 8 ? linRGB(v) : v); }
function lightFor(hour){
  const sun = sunFor(hour);
  const a = toLin(keyAt(K_SET, sun.el)), b = toLin(keyAt(K_RISE, sun.el));
  const w = sun.rising ? 1 : 0;
  const pick = (i) => Array.isArray(a[i]) ? mix3(a[i], b[i], w) : mix(a[i], b[i], w);
  return { sun, ev: pick(1), wb: pick(2), sat: pick(3), con: pick(4), skyMix: pick(5), zenith: pick(6), horizon: pick(7), glow: pick(8) };
}
function smooth(e0, e1, x){ const t = Math.min(1, Math.max(0, (x - e0)/(e1 - e0))); return t*t*(3 - 2*t); }
function moonPhase(date){
  const synodic = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14)/86400000;
  const ph = ((date.getTime()/86400000 - ref)/synodic) % 1;
  return (ph + 1) % 1;                                   // 0 new, 0.5 full
}

/* ---------- state ---------- */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = { hour: null, pinned: false, weather: { cloud: 0.18, wind: 3 }, windPinned: false,
                motion: REDUCE ? 0 : 1, t0: performance.now(), frozen: null };
if (QS.has('wind')) { state.weather.wind = parseFloat(QS.get('wind')); state.windPinned = true; }
if (QS.has('motion')) state.motion = parseFloat(QS.get('motion'));
// wind in m/s → how much the scene moves: a breath at 1 m/s, the reference at 5, a gale above 12
function windK(ms){
  const K = [[0, 0.25], [1, 0.35], [5, 1], [12, 2.5], [20, 2.8]];
  for (let i = 1; i < K.length; i++) if (ms <= K[i][0]) return K[i-1][1] + (K[i][1] - K[i-1][1])*(ms - K[i-1][0])/(K[i][0] - K[i-1][0]);
  return 2.8;
}
if (QS.has('hour')) { state.hour = parseFloat(QS.get('hour')); state.pinned = true; }
if (QS.has('t')) state.frozen = parseFloat(QS.get('t'));
if (QS.has('tools')) document.body.classList.add('tools');
const hr = document.getElementById('hr'), hv = document.getElementById('hv');
const wd = document.getElementById('wd'), wv = document.getElementById('wv');
const mo = document.getElementById('mo'), mv = document.getElementById('mv');
wd.addEventListener('input', () => { state.weather.wind = parseFloat(wd.value); state.windPinned = true; });
hr.addEventListener('input', () => { state.hour = parseFloat(hr.value); state.pinned = true; });
mo.addEventListener('input', () => {
  state.motion = parseFloat(mo.value)/100;
  // with reduced motion the scene draws once a second; asked to move, it moves smoothly
  if (REDUCE) interval = state.motion > 0 ? (IS_PHONE ? 1000/30 : 1000/60) : 1000;
});
mo.value = Math.round(state.motion*100);

/* ---------- night lights: drawn once per change into a texture, not computed per pixel ---------- */
const LIGHT_COL = [[1.0, 0.72, 0.42], [1.0, 0.56, 0.22], [1.0, 0.78, 0.55]];
const lights = LIGHT_PX.map((l, i) => {
  let s = 977 + i*7919; const r = () => { s = (s*16807) % 2147483647; return s/2147483647; };
  r();
  const kind = l[3];
  return { x: l[0], y: l[1], rad: l[2], kind,
           onEl: kind === 1 ? -1.0 - r()*1.5 : -0.8 - r()*6.5,
           off: kind === 0 && r() > 0.45 ? 22.8 + r()*3.8 : 99,
           col: LIGHT_COL[kind].map(c => c*(0.9 + 0.2*r())),
           gain: kind === 2 ? 0.9 : kind === 1 ? 1.3 : 1.0, on: 0 };
});
// each light's glow, once: a soft window (taller than wide, light spilling on the wall) or a lamp
for (const l of lights){
  const R = Math.ceil(l.rad*12), n = 2*R + 1, k = new Float32Array(n*n), rad = l.rad;
  for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++){
    const dx = x + 0.5 - (l.x % 1), dy = y + 0.5 - (l.y % 1), r = Math.hypot(dx, dy);
    let core, halo;
    if (l.kind === 0){
      const hx = rad*0.95, hy = rad*1.7;
      const sx = Math.min(1, Math.max(0, (hx - Math.abs(dx))/(hx*0.55))), sy = Math.min(1, Math.max(0, (hy - Math.abs(dy))/(hy*0.4)));
      core = sx*sx*(3 - 2*sx)*sy*sy*(3 - 2*sy)*(0.8 + 0.2*Math.min(1, Math.max(0, (hy - dy)/(2*hy))));
      halo = Math.exp(-r/(rad*2.2))*0.10 + Math.exp(-r/(rad*6.0))*0.035;
    } else {
      core = Math.exp(-r*r/(rad*rad*0.8));
      halo = Math.exp(-r/(rad*2.6))*(l.kind === 1 ? 0.25 : 0.12);
    }
    const cut = Math.min(1, Math.max(0, (R - r)/(R*0.45)));
    k[(y + R)*n + (x + R)] = (core*1.35 + halo*cut*cut*(3 - 2*cut))*l.gain;
  }
  l.R = R; l.kernel = k;
}
// the lights only ever touch this rectangle of the photo: work and upload just there
const BOX = lights.reduce((b, l) => [Math.min(b[0], Math.floor(l.x) - l.R), Math.min(b[1], Math.floor(l.y) - l.R),
                                     Math.max(b[2], Math.floor(l.x) + l.R + 1), Math.max(b[3], Math.floor(l.y) + l.R + 1)],
                          [Infinity, Infinity, -Infinity, -Infinity]).map((v, i) => Math.max(0, Math.min(i % 2 ? SCENE.h : SCENE.w, v)));
const BW = BOX[2] - BOX[0], BH = BOX[3] - BOX[1];
const lightAcc = new Float32Array(BW*BH*3), lightBytes = new Uint8Array(BW*BH*4);
const SRGB = new Uint8Array(4097);
for (let i = 0; i <= 4096; i++){ const v = i/4096; SRGB[i] = Math.round(255*(v <= 0.0031308 ? v*12.92 : 1.055*Math.pow(v, 1/2.4) - 0.055)); }
let lightTex = null, lightsShown = null, lightsAt = 0;
function updateLights(el, hour, now, eager){
  const late = hour < 12 ? hour + 24 : hour;
  let change = lightsShown ? 0 : 1;
  for (const l of lights){
    l.on = smooth(l.onEl + 0.6, l.onEl - 0.6, el)*(1 - smooth(l.off, l.off + 0.25, late));
    if (lightsShown) change = Math.max(change, Math.abs(l.on - lightsShown.get(l)));
  }
  if (change < 0.015 || now - lightsAt < (eager ? 120 : 500)) return;
  lightAcc.fill(0);
  for (const l of lights){
    if (l.on < 0.002) continue;
    const R = l.R, n = 2*R + 1, cx = Math.floor(l.x) - BOX[0], cy = Math.floor(l.y) - BOX[1];
    for (let y = -R; y <= R; y++){
      const py = cy + y; if (py < 0 || py >= BH) continue;
      for (let x = -R; x <= R; x++){
        const px = cx + x; if (px < 0 || px >= BW) continue;
        const v = l.kernel[(y + R)*n + (x + R)]*l.on, o = (py*BW + px)*3;
        lightAcc[o] += v*l.col[0]; lightAcc[o + 1] += v*l.col[1]; lightAcc[o + 2] += v*l.col[2];
      }
    }
  }
  const k = 4096/LIGHT_SCALE;
  for (let i = 0, j = 0; i < BW*BH; i++, j += 3){
    lightBytes[i*4]     = SRGB[Math.min(4096, (lightAcc[j]*k) | 0)];
    lightBytes[i*4 + 1] = SRGB[Math.min(4096, (lightAcc[j + 1]*k) | 0)];
    lightBytes[i*4 + 2] = SRGB[Math.min(4096, (lightAcc[j + 2]*k) | 0)];
    lightBytes[i*4 + 3] = 255;

  if (!lightTex){
    lightTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, lightTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, SCENE.w, SCENE.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(SCENE.w*SCENE.h*4));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(U.uLights, 7);

  gl.texSubImage2D(gl.TEXTURE_2D, 0, BOX[0], BOX[1], BW, BH, gl.RGBA, gl.UNSIGNED_BYTE, lightBytes);

/* ---------- size: the canvas holds the photo's own pixels, never more than the screen's ---------- */
const DPR = window.devicePixelRatio || 1;
let quality = 1;                       // lowered only if frames come too slowly
let viewW = 0, viewH = 0, view = null;
function layout(){
  let w = Math.max(2, innerWidth), h = Math.max(2, innerHeight);
  // only the height shrank (the keyboard, the browser's bars): keep the picture where it is and let
  // the bottom be covered, instead of cropping again and making it jump
  if (w === viewW && h < viewH) h = viewH;
  const key = w + 'x' + h + 'x' + quality;
  if (view && view.key === key) return view;
  viewW = w; viewH = h;
  const A = w/h, a = SCENE.w/SCENE.h;
  const vis = A > a ? [1, a/A] : [A/a, 1];
  const f = A >= 1 ? SCENE.focal.landscape : SCENE.focal.portrait;
  const density = vis[1]*SCENE.h/h;     // photo pixels per CSS pixel
  let W, H, uv, off;
  if (density <= DPR && quality === 1){
    // one canvas pixel per photo pixel, on the photo's own grid: as sharp as the photo can be
    W = Math.round(vis[0]*SCENE.w); H = Math.round(vis[1]*SCENE.h);
    uv = [W/SCENE.w, H/SCENE.h];
    off = [Math.round(f[0]*(SCENE.w - W))/SCENE.w, Math.round(f[1]*(SCENE.h - H))/SCENE.h];
  } else {
    const k = Math.min(density, DPR)*quality;
    W = Math.max(2, Math.round(w*k)); H = Math.max(2, Math.round(h*k));
    uv = vis; off = [f[0]*(1 - vis[0]), f[1]*(1 - vis[1])];
  }
  canvas.width = W; canvas.height = H;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  view = { key, W, H, uv, off };
  return view;
}

function frame(now){
  const t = state.frozen !== null ? state.frozen : (now - state.t0)/1000;
  const d = new Date();
  const hour = state.hour !== null ? state.hour : d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600;
  const L = lightFor(hour);
  const el = L.sun.el;
  hv.textContent = String(Math.floor(hour)).padStart(2, '0') + ':' + String(Math.floor((hour % 1)*60)).padStart(2, '0');
  if (!state.pinned) hr.value = hour;

  // the sea keeps its own clock: "Movimento" sets how fast it runs (at 0 it holds still, not flat)
  const wk = windK(state.weather.wind), M = Math.max(0, state.motion);
  if (state.frozen !== null) seaT = state.frozen*M;
  else { seaT = (seaT + (seaLast ? Math.min(0.1, (now - seaLast)/1000) : 0)*M) % 7200; }
  seaLast = now;
  drawWaves(seaT);

  const V = layout();
  gl.viewport(0, 0, V.W, V.H);

  // sun position on the authored arc; moon over the far coast at night
  let sunPos = [2, 2], sunVis = 0;
  if (el > -4){
    const set = !L.sun.rising, P = set ? SCENE.sunSet : SCENE.sunRise;
    const k = Math.max(0, el)/12;
    sunPos = [P[0] - (set ? 0.25 : -0.2)*Math.min(1, k), SCENE.horizonY - 0.012*el];
    sunVis = smooth(-4, 0, el)*(1 - smooth(8, 18, el));
  }
  const night = smooth(-4, -12, el);
  const sunCol = [1, 0.35 + 0.55*smooth(0, 20, el), 0.1 + 0.7*smooth(2, 30, el)];
  const moonVis = smooth(-2, -8, el);
  const phase = moonPhase(d);

  gl.uniform2f(U.uRes, V.W, V.H);
  gl.uniform2f(U.uImg, SCENE.w, SCENE.h);
  gl.uniform2f(U.uOff, V.off[0], V.off[1]);
  gl.uniform2f(U.uVis, V.uv[0], V.uv[1]);
  gl.uniform1f(U.uTime, t % 3600);
  // motion: the wind sets it, "Movimento" scales it, reduced motion stops it
  wv.textContent = state.weather.wind.toFixed(1) + ' m/s';
  mv.textContent = Math.round(M*100) + '%';
  if (!state.windPinned) wd.value = state.weather.wind;
  // the sea: how rough the wind makes it (slope of a sea surface, after Cox and Munk), the swell,
  // the sun and the moon it mirrors
  const wind = Math.max(0, state.weather.wind), slope2 = (0.003 + 0.00512*wind)*SEA_GAIN*SEA_GAIN;
  gl.uniform4f(U.uCam, SCENE.camera.f, SCENE.camera.cx, SCENE.camera.cy, SCENE.camera.pitch);
  gl.uniform1f(U.uCamH, SCENE.camera.height);
  gl.uniform1f(U.uSeaT, seaT);
  gl.uniform2f(U.uAmp, Math.sqrt(0.15*slope2), Math.sqrt(0.85*slope2));
  gl.uniform4f(U.uSwK, SWELL[0].kx, SWELL[0].ky, SWELL[1].kx, SWELL[1].ky);
  gl.uniform2f(U.uSwW, SWELL[0].w, SWELL[1].w);
  gl.uniform1f(U.uSwA, 0.12 + 0.025*Math.min(wind, 12));
  gl.uniform1f(U.uWind, wind);
  gl.uniform4fv(U.uObjBox, SCENE.objects.flat());
  gl.uniform4fv(U.uBoom, SCENE.boom);
  // the sun goes round: up behind the hill on the left, behind the camera at noon, down over the
  // far coast on the right (where the drawn sun sets)
  let phi = (L.sun.t !== null ? -18 - L.sun.t*318.5 : 0)*Math.PI/180;
  if (sunVis > 0){                    // low in the sky: right where the drawn sun is, so its path lines up
    const dr = camRay(sunPos[0]*SCENE.w, sunPos[1]*SCENE.h), pd = Math.atan2(dr[0], dr[1]);
    const f = smooth(20, 10, el), da = Math.atan2(Math.sin(pd - phi), Math.cos(pd - phi));
    phi += da*f;
  }
  const er = Math.max(el, -2)*Math.PI/180;
  gl.uniform3f(U.uSunDir, Math.sin(phi)*Math.cos(er), Math.cos(phi)*Math.cos(er), Math.sin(er));
  const sunK = 3.2*smooth(-1.5, 3, el)*(1 - 0.7*state.weather.cloud);
  gl.uniform3fv(U.uSunSpec, sunCol.map(c => c*sunK));
  gl.uniform3fv(U.uMoonDir, camRay(SCENE.moon[0]*SCENE.w, SCENE.moon[1]*SCENE.h));
  gl.uniform3fv(U.uMoonSpec, [0.75, 0.82, 1].map(c => c*0.22*moonVis));
  gl.uniform1f(U.uSpark, 0.22*smooth(4, 20, el)*(1 - 0.6*state.weather.cloud));
  gl.uniform1f(U.uStarTw, 0.08*Math.min(1, M));
  gl.uniform1f(U.uHorizonY, SCENE.horizonY);
  gl.uniform1f(U.uEV, L.ev);
  gl.uniform3fv(U.uWB, L.wb);
  gl.uniform1f(U.uSat, L.sat);
  gl.uniform1f(U.uCon, L.con);
  gl.uniform1f(U.uSkyMix, L.skyMix);
  gl.uniform3fv(U.uZenith, L.zenith);
  gl.uniform3fv(U.uHorizon, L.horizon);
  gl.uniform3fv(U.uGlow, L.glow);
  gl.uniform3fv(U.uLift, [0.004*night, 0.006*night, 0.012*night]);
  gl.uniform1f(U.uNight, night);
  gl.uniform1f(U.uStars, smooth(-6, -14, el)*(1 - state.weather.cloud));
  gl.uniform1f(U.uCloud, state.weather.cloud);
  gl.uniform2f(U.uSunPos, sunPos[0], sunPos[1]);
  gl.uniform3fv(U.uSunCol, sunCol);
  gl.uniform1f(U.uSunVis, sunVis);
  gl.uniform2f(U.uMoonPos, SCENE.moon[0], SCENE.moon[1]);
  gl.uniform2f(U.uMoonPhase, phase, phase < 0.5 ? 1 : 0);
  gl.uniform1f(U.uMoonVis, moonVis);
  gl.uniform1f(U.uGlint, smooth(-2, 14, el));

  // lights: on as the dusk deepens, some houses go dark late at night
  const lk = smooth(1, -3, el);
  if (lk > 0.001) updateLights(el, hour, now, state.pinned);
  gl.uniform1f(U.uLightsK, lightTex ? lk*(0.35 + 0.65*night) : 0);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // the leaves in front, on their clock (the sea's: "Movimento" sets its pace), moved by the wind
  drawFoliage(seaT, wk, V, { uEV: L.ev, uSat: L.sat, uCon: L.con, uNight: night, uWB: L.wb,
                              uLift: [0.004*night, 0.006*night, 0.012*night] });
}
// how rough the sea looks for a given wind: 1 is a real sea's (Cox and Munk); tuned on the photo
const SEA_GAIN = 1.3;

/* ---------- pace: steady 30 fps on phones, 60 elsewhere; slower frames lower the resolution ---------- */
let interval = REDUCE ? 1000 : IS_PHONE ? 1000/30 : 1000/60;
let lastFrame = 0, drawn = 0, perf = { sum: 0, n: 0, since: 0 }, upBlockedUntil = 0;
function adapt(dt, now){
  if (dt > 250) return;                                   // a background tab or a hitch
  if (!perf.since) perf.since = now;
  perf.sum += dt; perf.n++;
  if (now - perf.since < 2000 || perf.n < 20) return;
  const avg = perf.sum/perf.n; perf = { sum: 0, n: 0, since: now };
  if (avg > 150 || REDUCE) return;                        // software rendering: leave it alone
  if (avg > interval*1.3){
    if (interval < 30) interval = 1000/30;                // a desktop that cannot hold 60 settles at 30
    else quality = Math.max(0.6, quality*0.85);
    upBlockedUntil = now + 20000;
  } else if (avg < interval*1.1 && quality < 1 && now > upBlockedUntil){
    quality = Math.min(1, quality*1.06);
    if (quality > 0.98) quality = 1;
  }
}

let stopped = false, ready = false;
function stop(reason){
  if (stopped) return; stopped = true;
  if (EMBED) window.parent.postMessage({type:'site:scene-error', reason: String(reason)}, '*');
}
function loop(now){
  if (stopped) return;
  if (!QS.has('still')) requestAnimationFrame(loop);
  if (ready && now - lastFrame < interval - 4) return;
  try {
    if (lastFrame) adapt(now - lastFrame, now);
    lastFrame = now;
    frame(now); drawn++;
    if (!ready){
      ready = true; document.body.dataset.ready = '1';
      if (EMBED) window.parent.postMessage({type:'site:scene-ready'}, ORIGIN === 'null' ? '*' : ORIGIN);
    }
  } catch (e){ stop(e && e.message || e); }
}

window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  if (/^https?:$/.test(location.protocol) && e.origin !== ORIGIN) return;
  const m = e.data || {};
  if (m.type === 'site:time' && Number.isFinite(m.hour)){
    if (!state.pinned) state.hour = ((m.hour % 24) + 24) % 24;
    if (m.weather && Number.isFinite(m.weather.cloud)) state.weather.cloud = Math.min(1, Math.max(0.1, m.weather.cloud));
    if (m.weather && Number.isFinite(m.weather.wind) && !state.windPinned) state.weather.wind = m.weather.wind;
    if (QS.has('still')) frame(performance.now());
  }
  // "Cambia il meteo": the hour, the wind and how much the scene moves
  if (m.type === 'site:tools'){
    const ins = m.insets || {};
    for (const k of ['t', 'r', 'b', 'l']) document.documentElement.style.setProperty('--sa-' + k, (Number.isFinite(ins[k]) ? ins[k] : 0) + 'px');
    document.body.classList.toggle('tools', !!m.open);
  }
});

// test hooks: render a given hour and moment deterministically; read the canvas size and pace
window.__scene = {
  set(hour, t, wind, motion){
    state.hour = hour; state.pinned = true;
    if (t !== undefined) state.frozen = t;
    if (wind !== undefined){ state.weather.wind = wind; state.windPinned = true; }
    if (motion !== undefined) state.motion = motion;
    frame(performance.now());
  },
  info: () => ({ canvas: canvas.width + 'x' + canvas.height, quality, interval: Math.round(interval), lights: lights.length, drawn })
};

try {
  // the rig is a file on the site; the single-file build puts the object itself here instead
  const rigSrc = 'img/rig.json';
  const [maps, sky, fill, plate, seabed, sea, objects, rig] = await Promise.all([
    loadImage('img/maps.png'), loadImage('img/sky.png'), loadImage('img/skyfill.png'), loadImage(SCENE.plate),
    loadImage('img/seabed.webp'), loadImage('img/sea.png'), loadImage('img/objects.webp'),
    typeof rigSrc === 'string' ? fetch(rigSrc).then(r => r.json()) : rigSrc]);
  gl.useProgram(prog);
  texture(4, plate, {srgb: true, mips: true}); gl.uniform1i(U.uPlate, 4);
  texture(1, maps); gl.uniform1i(U.uMaps, 1);
  texture(2, sky, {red: true}); gl.uniform1i(U.uSky, 2);
  texture(3, fill, {srgb: true}); gl.uniform1i(U.uFill, 3);
  texture(10, seabed, {srgb: true}); gl.uniform1i(U.uSeabed, 10);
  texture(11, sea); gl.uniform1i(U.uSea, 11);
  texture(12, objects, {srgb: true}); gl.uniform1i(U.uObjects, 12);
  gl.uniform1i(U.uWaveA, 8); gl.uniform1i(U.uWaveB, 9);
  setupFoliage(rig);
  gl.useProgram(prog); gl.bindVertexArray(mainVAO);
  requestAnimationFrame(loop);
} catch (e){ stop(e && e.message || e); }
addEventListener('error', e => stop(e.error || e.message));
addEventListener('unhandledrejection', e => stop(e.reason));
</script>
</body>

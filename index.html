<style>
  @font-face { font-family:'Cormorant Garamond'; font-weight:300; font-display:block; src:url(fonts/cormorant-garamond-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family:'Cormorant Garamond'; font-weight:400; font-display:block; src:url(fonts/cormorant-garamond-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Cormorant Garamond'; font-weight:500; font-display:block; src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter Tight'; font-weight:300; font-display:swap; src:url(fonts/inter-tight-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter Tight'; font-weight:400; font-display:swap; src:url(fonts/inter-tight-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter Tight'; font-weight:500; font-display:swap; src:url(fonts/inter-tight-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter Tight'; font-weight:600; font-display:swap; src:url(fonts/inter-tight-latin-600-normal.woff2) format('woff2'); }

  :root { --yellow:#FFBF00; --ink:#eef2f8; --edge:#0b1a24; color-scheme:dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:var(--edge); overscroll-behavior:none; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; color:#fff; }

  /* until the scene's first frame: a light copy of the photo, toned for the hour and framed exactly
     as the scene frames it, over a tiny blurred placeholder that is there from the very first paint */
  /* Two photos: the tall one upright (phones), the wide one on screens wider than tall, framed as
     the scene frames them: filling the screen, cropped around the same focal point */
  #poster { position:fixed; inset:0; z-index:0; overflow:hidden;
            filter:brightness(var(--dim,1)) saturate(var(--sat,1)); }
  #poster::before, #poster::after { content:''; position:absolute; background-repeat:no-repeat; background-size:cover; background-position:43% 50%; }
  #poster::before { inset:-40px; background-image:var(--lqip); filter:blur(24px); }
  #poster::after { inset:0; background-image:url(img/poster.webp); }
  @media (orientation: landscape){ #poster::after { background-image:url(img/wide/poster.webp); background-position:55% 62%; } }
  #scene-frame { position:fixed; inset:0; z-index:0; width:100%; height:100%; border:0; display:block;
                 pointer-events:none; opacity:0; transition:opacity 1.2s ease; background:transparent; }
  /* a veil at the bottom keeps the time readable over the bright sea; one at the top for the menu */
  body::before { content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity .6s;
                 background:radial-gradient(ellipse 72% 82% at 0 0, rgba(4,14,22,.78), rgba(4,14,22,.52) 34%, rgba(4,14,22,.2) 60%, transparent 82%); }
  body.unlocked::before { opacity:1; }
  body::after { content:''; position:fixed; inset:auto 0 0; height:36%; z-index:1; pointer-events:none;
                background:linear-gradient(to top, rgba(4,16,26,.48), rgba(4,16,26,.16) 55%, transparent); }
  .ui { position:fixed; z-index:2; text-shadow:0 1px 14px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.5); }
  #where, #lock { transition:opacity .35s, visibility .35s; }
  body.tuning #where, body.tuning #info, body.tuning #lock, body.tuning::before, body.tuning::after { opacity:0; visibility:hidden; }

  /* bottom right: the visitor's time and sky, out of the way of the sun and the moon */
  #where { bottom:calc(clamp(18px,3.4vh,32px) + env(safe-area-inset-bottom)); right:calc(clamp(20px,4vw,56px) + env(safe-area-inset-right)); text-align:right; }
  #clock { font-weight:300; font-size:clamp(22px,2.3vw,30px); letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  #place { font-size:clamp(11px,.95vw,13px); letter-spacing:.08em; text-transform:uppercase; opacity:.85; margin-top:2px; }
  .amb { font-weight:300; font-size:clamp(12px,1vw,13.5px); letter-spacing:.02em; opacity:.92; margin-top:6px; font-variant-numeric:tabular-nums; }
  .amb + .amb { margin-top:2px; }
  .amb:empty { display:none; }
  #date::first-letter { text-transform:uppercase; }
  #lang { font-size:clamp(11px,.9vw,12.5px); letter-spacing:.1em; font-weight:500; margin-top:10px; }
  #lang a { color:#fff; text-decoration:none; opacity:.55; }
  #lang a.on { opacity:1; border-bottom:1px solid #fff; }
  #logout { display:none; margin-left:14px; }
  body.unlocked #logout { display:inline; }

  /* the lock: frosted glass, as the cards of vittoriodini.it */
  #lock { position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; padding:24px;
          transition:opacity .45s, transform .45s, visibility .45s; }
  body.unlocked #lock { opacity:0; visibility:hidden; transform:scale(.97); pointer-events:none; }
  .glass { background:rgba(14,24,40,.40); -webkit-backdrop-filter:blur(20px) saturate(1.25); backdrop-filter:blur(20px) saturate(1.25);
           border:1px solid rgba(255,255,255,.2); border-radius:16px;
           box-shadow:0 24px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14); }
  #login { container-type:inline-size; width:min(420px, 100%); padding:clamp(34px,5vh,48px) clamp(26px,3.4vw,42px) clamp(26px,3.6vh,34px); text-align:center; }
  /* the wordmark scales with the glass (12 letters ≈ 7.9 em with the spacing), so it never spills out */
  .logo { font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:min(40px, 11.2cqi); white-space:nowrap;
          letter-spacing:.12em; line-height:1; color:var(--yellow); text-shadow:0 1px 14px rgba(0,0,0,.3); margin-right:-.12em; }
  .rule { width:70px; height:1px; background:var(--yellow); opacity:.75; margin:16px auto 20px; }
  .sub { font-family:'Cormorant Garamond',Georgia,serif; font-weight:300; font-size:20px; letter-spacing:.08em; opacity:.95; margin-bottom:24px; }
  .field { position:relative; }
  .field input { width:100%; font:400 16px/1.2 'Inter Tight',system-ui,sans-serif; color:#fff; letter-spacing:.02em;
                 background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.26); border-radius:10px;
                 padding:13px 46px 13px 16px; outline:none; transition:border-color .2s, box-shadow .2s, background .2s; }
  .field input::placeholder { color:rgba(255,255,255,.62); }
  .field input:focus { border-color:var(--yellow); background:rgba(255,255,255,.12); box-shadow:0 0 0 3px rgba(255,191,0,.18); }
  .eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:36px; height:36px; border:0; background:none;
         color:#fff; opacity:.6; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:8px; }
  .eye:hover { opacity:1; }
  .eye svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .enter { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; cursor:pointer;
           background:var(--yellow); color:#1d1604; font:600 15px 'Inter Tight',system-ui,sans-serif; letter-spacing:.04em;
           transition:background .2s, transform .2s, box-shadow .2s; }
  .enter:hover { background:#ffca2c; transform:translateY(-1px); box-shadow:0 8px 24px rgba(255,191,0,.28); }
  .enter:focus-visible, .eye:focus-visible, #tune:focus-visible, #lang a:focus-visible, #links a:focus-visible { outline:2px solid var(--yellow); outline-offset:3px; }
  #err { min-height:18px; margin-top:12px; font-size:13px; color:#ffc4b8; text-shadow:0 1px 6px rgba(0,0,0,.4); }
  .shake { animation:shake .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)} }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* after the password: the layout of vittoriodini.it, same measures */
  #info { top:calc(clamp(20px,4vh,48px) + env(safe-area-inset-top)); left:calc(clamp(20px,4vw,56px) + env(safe-area-inset-left));
          max-width:min(540px,72vw); opacity:0; visibility:hidden; transform:translateY(6px); pointer-events:none;
          transition:opacity .6s .15s, transform .6s .15s, visibility .6s; }
  body.unlocked #info { opacity:1; visibility:visible; transform:none; }
  body.unlocked.tuning #info { opacity:0; visibility:hidden; }   /* the weather panel gets the whole scene */
  #info a { pointer-events:auto; }
  #greet { font-weight:300; font-size:clamp(15px,1.5vw,19px); letter-spacing:.02em; opacity:.92; }
  #name { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:clamp(22px,2.5vw,33px); letter-spacing:.1em;

  #bio { font-weight:300; font-size:clamp(13px,1.15vw,15.5px); line-height:1.55; opacity:.88; margin-top:10px; }
  #links { margin-top:18px; display:grid; grid-template-columns:max-content max-content; gap:10px 28px; width:max-content; max-width:100%; }
  #links a { color:#fff; text-decoration:none; font-weight:500; font-size:clamp(12.5px,1.05vw,14.5px);

             transition:opacity .2s, border-color .2s; cursor:pointer; }
  #links a:hover { opacity:1; border-color:#fff; }

  /* cards: the frosted glass of vittoriodini.it */
  #veil { position:fixed; inset:0; z-index:5; background:rgba(4,8,16,.22); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
          opacity:0; pointer-events:none; transition:opacity .25s; }
  #veil.open { opacity:1; pointer-events:auto; }
  #panel { position:fixed; z-index:6; top:50%; left:50%; transform:translate(-50%,-48%); width:min(880px,94vw);
           max-height:82vh; max-height:82dvh; display:flex; flex-direction:column; overflow:hidden;

           transition:opacity .25s, transform .25s, visibility .25s; }
  #panel.open { opacity:1; pointer-events:auto; visibility:visible; transform:translate(-50%,-50%); }
  #panel-header { display:flex; align-items:flex-start; gap:16px; flex:none; padding:clamp(24px,3.5vw,44px) clamp(24px,3.5vw,44px) 0; }

  #panel.scrolled #panel-title { font-size:17px; opacity:.72; }
  #panel-body { overflow-y:auto; min-height:0; overscroll-behavior:contain; scrollbar-width:none;

  #panel-body::-webkit-scrollbar { display:none; }
  #panel .entry { display:flex; gap:15px; margin:0 0 18px; align-items:flex-start; }
  #panel .logo { width:40px; height:40px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;

  #panel .erole { font-weight:500; font-size:14.5px; line-height:1.4; }
  #panel .erole a { color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(255,255,255,.25); }
  #panel .erole a:hover { border-color:#fff; }
  #panel .eco { font-weight:300; font-size:13.5px; opacity:.85; margin-top:1px; }
  #panel .emeta { font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.62; margin-top:3px; }
  #panel .edesc { font-weight:300; font-size:13px; line-height:1.6; opacity:.85; margin-top:6px; }
  #panel p { font-weight:300; font-size:13.5px; line-height:1.6; opacity:.9; }
  #panel .about-paragraph + .about-paragraph { margin-top:14px; }
  #panel a { color:#9cc4ee; }
  #close { margin:-8px -10px 0 auto; padding:4px 10px; background:none; border:none; color:#fff; font-size:22px;

  #close:hover { opacity:1; }

  #tune { position:fixed; left:calc(clamp(20px,4vw,56px) + env(safe-area-inset-left)); bottom:calc(clamp(18px,3.4vh,32px) + env(safe-area-inset-bottom));
          font:400 11px 'Inter Tight',system-ui,sans-serif; letter-spacing:.06em; color:#fff; background:none; border:0; cursor:pointer;
          border-bottom:1px dotted rgba(255,255,255,.4); padding:0 0 1px; opacity:.22; visibility:hidden; z-index:4; }
  #tune.on { visibility:visible; }
  #tune:hover, #tune.active, #tune:focus-visible { opacity:.9; }

  @media (max-width:640px){

    #lock { align-items:flex-end; padding:0 18px calc(136px + env(safe-area-inset-bottom)); }
    #clock { font-size:24px; } .amb { font-size:11.5px; margin-top:3px; } #date { display:none; } #lang { margin-top:6px; }
    #login { padding:28px 22px 20px; }
    #tune { left:calc(18px + env(safe-area-inset-left)); bottom:calc(20px + env(safe-area-inset-bottom)); opacity:.4; font-size:11.5px; padding:6px 0 2px; }
    #info { top:calc(22px + env(safe-area-inset-top)); left:20px; max-width:calc(100vw - 40px); }
    body::before { background:linear-gradient(to bottom, rgba(4,14,22,.74), rgba(4,14,22,.46) 30%, rgba(4,14,22,.12) 52%, transparent 64%); }
    #links { gap:9px 22px; }
    #panel { max-height:74vh; max-height:74dvh; }
    #panel .logo { width:34px; height:34px; font-size:11px; }
  }
  @media (max-height:500px){
    #lock { align-items:center; }
    #login { padding:18px 24px 12px; width:min(360px,100%); }
    .rule { margin:10px auto 10px; } .sub { margin-bottom:10px; font-size:17px; }
    #lock { justify-content:flex-start; padding-left:calc(24px + env(safe-area-inset-left)); }
    #where .amb#date, #where .amb#sun { display:none; }
  }
  @media (prefers-reduced-motion: reduce){ * { transition-duration:.01s !important; animation:none !important; } }

<body>
<div id="poster" aria-hidden="true"></div>
<iframe id="scene-frame" src="scene.html" title="Sfondo animato" aria-hidden="true" tabindex="-1"></iframe>

<div class="ui" id="where">
  <div id="clock">--:--</div>
  <div id="place"></div>
  <div class="amb" id="date"></div>
  <div class="amb" id="sun"></div>
  <div class="amb" id="weather"></div>
  <div id="lang"><a id="lang-it" href="#it">IT</a> &middot; <a id="lang-en" href="#en">EN</a><a id="logout" href="#esci"></a></div>
</div>

<main id="lock">
  <form class="glass" id="login" method="dialog" autocomplete="on">
    <div class="logo" aria-hidden="true">BECCHIGIALLI</div>
    <div class="rule"></div>
    <h1 class="sub" id="lock-sub">Accesso riservato</h1>
    <input class="sr" type="text" name="username" autocomplete="username" value="becchigialli" tabindex="-1" aria-hidden="true">
    <div class="field">
      <label class="sr" for="pw" id="pw-label">Password</label>
      <input id="pw" type="password" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Password" required>
      <button class="eye" id="eye" type="button" aria-label="Mostra la password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="enter" id="enter" type="submit">Entra</button>
    <div id="err" role="alert" aria-live="assertive"></div>
  </form>
</main>

<div class="ui" id="info">
  <div id="greet"></div>
  <div id="name">BECCHIGIALLI</div>
  <p id="bio"></p>
  <nav id="links" aria-label="Menu"></nav>
</div>
<div id="veil"></div>
<div id="panel" class="glass" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true" inert><div id="panel-header"><h2 id="panel-title"></h2><button id="close" aria-label="Chiudi">&times;</button></div><div id="panel-body"></div></div>

<button id="tune" type="button" aria-expanded="false">Cambia il meteo</button>

<script type="module">
import { sunTimes, OFFICES } from './astro.js';

const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

const T = {
  it: {
    sub: 'Accesso riservato', pw: 'Password', enter: 'Entra', bad: 'Password non corretta. Riprova.', show: 'Mostra la password', hide: 'Nascondi la password',
    local: 'Ora locale', sunrise: 'Alba', sunset: 'Tramonto', logout: 'Esci', tune: 'Cambia il meteo', close: 'Chiudi',
    greet: { m: 'Buongiorno.', a: 'Buon pomeriggio.', e: 'Buonasera.', n: 'Buonanotte.' },
    bio: 'Holding immobiliare. Da oltre 30 anni offriamo soluzioni abitative a breve e lungo termine, in Italia e all’estero.',
    wmo: { 0:'sereno', 1:'prevalentemente sereno', 2:'poco nuvoloso', 3:'coperto', 45:'nebbia', 48:'nebbia', 51:'pioviggine', 53:'pioviggine', 55:'pioviggine', 56:'pioviggine gelata', 57:'pioviggine gelata',
           61:'pioggia debole', 63:'pioggia', 65:'pioggia forte', 66:'pioggia gelata', 67:'pioggia gelata', 71:'neve debole', 73:'neve', 75:'neve forte', 77:'nevischio',
           80:'rovesci', 81:'rovesci', 82:'rovesci forti', 85:'rovesci di neve', 86:'rovesci di neve', 95:'temporale', 96:'temporale con grandine', 99:'temporale con grandine' }
  },
  en: {
    sub: 'Private access', pw: 'Password', enter: 'Enter', bad: 'Wrong password. Please try again.', show: 'Show password', hide: 'Hide password',
    local: 'Local time', sunrise: 'Sunrise', sunset: 'Sunset', logout: 'Sign out', tune: 'Change the weather', close: 'Close',
    greet: { m: 'Good morning.', a: 'Good afternoon.', e: 'Good evening.', n: 'Good night.' },
    bio: 'Real estate holding. For over 30 years we have offered short and long term homes, in Italy and abroad.',
    wmo: { 0:'clear', 1:'mainly clear', 2:'partly cloudy', 3:'overcast', 45:'fog', 48:'fog', 51:'drizzle', 53:'drizzle', 55:'drizzle', 56:'freezing drizzle', 57:'freezing drizzle',
           61:'light rain', 63:'rain', 65:'heavy rain', 66:'freezing rain', 67:'freezing rain', 71:'light snow', 73:'snow', 75:'heavy snow', 77:'snow grains',
           80:'showers', 81:'showers', 82:'heavy showers', 85:'snow showers', 86:'snow showers', 95:'thunderstorm', 96:'thunderstorm with hail', 99:'thunderstorm with hail' }
  }
};

/* ---------- language ---------- */
let stored = null; try { stored = localStorage.getItem('bg-lang'); } catch (e) {}
let lang = params.get('lang') || stored || ((navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en');
if (!T[lang]) lang = 'it';
function setLang(l, persist){
  lang = l; const t = T[l];
  if (persist) try { localStorage.setItem('bg-lang', l); } catch (e) {}
  document.documentElement.lang = l;
  $('lang-it').classList.toggle('on', l === 'it'); $('lang-en').classList.toggle('on', l === 'en');
  $('lock-sub').textContent = t.sub; $('pw').placeholder = t.pw; $('pw-label').textContent = t.pw; $('enter').textContent = t.enter;
  $('eye').setAttribute('aria-label', $('pw').type === 'password' ? t.show : t.hide);
  $('logout').textContent = t.logout; $('tune').textContent = t.tune; $('close').setAttribute('aria-label', t.close);
  $('bio').textContent = t.bio;
  renderLinks(); if (openKey) renderPanel(openKey);
  if ($('err').textContent) $('err').textContent = t.bad;
  tick(); renderWhere();
}
$('lang-it').addEventListener('click', e => { e.preventDefault(); setLang('it', true); });
$('lang-en').addEventListener('click', e => { e.preventDefault(); setLang('en', true); });

/* ---------- time ---------- */
// with ?hour= the whole page lives at that hour of today (for previews and tests)
function now(){
  const d = new Date();
  if (!params.has('hour')) return d;
  const h = parseFloat(params.get('hour'));
  d.setHours(Math.floor(h), Math.round((h % 1)*60), 0, 0);
  return d;
}
function visitorHour(){
  if (params.has('hour')) return parseFloat(params.get('hour'));
  const d = new Date(); return d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600;
}
const fmtTime = (d, tz) => new Intl.DateTimeFormat(lang === 'it' ? 'it-IT' : 'en-US',
  { hour: lang === 'it' ? '2-digit' : 'numeric', minute: '2-digit', hour12: lang === 'en', timeZone: tz }).format(d);
function tick(){
  const d = now(), t = T[lang];
  $('clock').textContent = params.get('ct') || fmtTime(d);
  $('date').textContent = new Intl.DateTimeFormat(lang === 'it' ? 'it-IT' : 'en-US', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
  const h = visitorHour();
  $('greet').textContent = t.greet[(h >= 5 && h < 12) ? 'm' : (h >= 12 && h < 18) ? 'a' : (h >= 18 && h < 23) ? 'e' : 'n'];
}
setInterval(tick, 5000);

/* ---------- where the visitor is, their sun and weather ---------- */
const where = { city: null, country: null, countryCode: null, lat: null, lon: null, weather: null };
function guessFromZone(){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const office = OFFICES.find(o => o.tz === tz);
  if (office) return { lat: office.lat, lon: office.lon };
  return { lat: 40, lon: -new Date().getTimezoneOffset()/4 };
}
function renderWhere(){
  const t = T[lang];
  $('place').textContent = where.city ? where.city + (where.country ? ', ' + where.country : '') : t.local;
  if (where.lat !== null){
    const s = sunTimes(new Date(), where.lat, where.lon);
    $('sun').textContent = s.rise ? `${t.sunrise} ${fmtTime(s.rise)} · ${t.sunset} ${fmtTime(s.set)}` : '';
  }
  if (where.weather){
    const w = where.weather, us = where.countryCode === 'US';
    const temp = us ? Math.round(w.temperature_2m*9/5 + 32) + '°F' : Math.round(w.temperature_2m) + '°';
    $('weather').textContent = temp + ' · ' + (t.wmo[w.weather_code] || '');
  }
}
async function locate(){
  const g = guessFromZone(); where.lat = g.lat; where.lon = g.lon; renderWhere();
  const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tries = [
    ['https://ipapi.co/json/', j => ({ city: j.city, code: j.country_code, lat: j.latitude, lon: j.longitude, tz: j.timezone })],
    ['https://ipwho.is/', j => j.success === false ? null : ({ city: j.city, code: j.country_code, lat: j.latitude, lon: j.longitude, tz: j.timezone && j.timezone.id })]
  ];
  for (const [url, map] of tries){
    try {
      const r = await fetch(url); if (!r.ok) throw 0;
      const j = map(await r.json()); if (!j) throw 0;
      where.city = j.city; where.countryCode = j.code;
      where.country = j.code ? new Intl.DisplayNames([lang], { type: 'region' }).of(j.code) : null;
      // behind a VPN the IP says one place and the clock another: trust the clock
      if (Number.isFinite(j.lat) && (!j.tz || j.tz === browserTz)){ where.lat = j.lat; where.lon = j.lon; }
      if (!params.get('lang') && !stored) setLang(j.code === 'IT' ? 'it' : 'en', false);
      break;
    } catch (e) {}
  }
  renderWhere();
  weather();
}
async function weather(){
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${where.lat.toFixed(2)}&longitude=${where.lon.toFixed(2)}` +
              '&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m&wind_speed_unit=ms&timezone=auto';
    const r = await fetch(u); if (!r.ok) throw 0;
    where.weather = (await r.json()).current;
    renderWhere(); syncScene();
  } catch (e) { $('weather').textContent = ''; }
}
setInterval(() => { if (!document.hidden) weather(); }, 15*60*1000);

/* ---------- the scene ---------- */
const frame = $('scene-frame');
{
  const pass = new URLSearchParams();
  for (const k of ['hour', 't', 'still', 'photo']) if (params.has(k)) pass.set(k, params.get(k));
  if ([...pass].length && frame.hasAttribute('src')) frame.src = 'scene.html?' + pass;
}
let sceneReady = false;
// the scene lives in a frame that knows nothing of the notch: hand it the page's safe areas
const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(insetProbe);
function safeInsets(){
  const cs = getComputedStyle(insetProbe);
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
// window.origin is the page's real origin: 'null' inside a sandboxed frame, where location.origin still
// shows the address. Messages carry nothing private (hour, weather, "ready"), so an opaque origin takes '*'.
const ORIGIN = window.origin || location.origin;
function sceneMessage(m){ if (frame.contentWindow) frame.contentWindow.postMessage(m, ORIGIN === 'null' ? '*' : ORIGIN); }
function syncScene(){
  const w = where.weather;
  sceneMessage({ type: 'site:time', hour: visitorHour(), weather: w ? { cloud: w.cloud_cover/100, wind: w.wind_speed_10m } : null });
}
let sceneTimer = 0;
frame.addEventListener('load', () => {
  if (!frame.hasAttribute('src') && !frame.hasAttribute('srcdoc')) return;   // the frame's first, empty page
  syncScene();
  clearTimeout(sceneTimer);
  sceneTimer = setTimeout(() => { if (!sceneReady) frame.style.display = 'none'; }, 30000);
});
// the single-file build carries the scene's source at the very end of the page (this script runs
// before it has arrived): it goes into the frame once the page has been drawn, so the panel never waits
function insertScene(){
  const src = document.getElementById('scene-src');
  if (src) requestAnimationFrame(() => setTimeout(() => {
    frame.srcdoc = src.textContent.replace(/<\\(\/?script|!--)/gi, '<$1');
    src.remove();
  }, 0));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', insertScene); else insertScene();
setInterval(syncScene, 30000);
window.addEventListener('message', e => {
  if (e.source !== frame.contentWindow) return;
  if (ORIGIN !== 'null' && e.origin !== ORIGIN) return;
  const m = e.data || {};
  if (m.type === 'site:scene-ready'){ sceneReady = true; frame.style.opacity = '1'; $('tune').classList.add('on'); syncScene(); document.body.dataset.ready = '1'; }
  if (m.type === 'site:scene-error'){ frame.style.display = 'none'; document.body.dataset.ready = '1'; }
  if (m.type === 'site:tools') setTune(!!m.open, true);
});
let tuneOpen = false;
function setTune(open, fromScene){
  tuneOpen = open;
  frame.style.pointerEvents = open ? 'auto' : 'none';
  document.body.classList.toggle('tuning', open);
  $('tune').classList.toggle('active', open);
  $('tune').setAttribute('aria-expanded', String(open));
  if (!fromScene) sceneMessage({ type: 'site:tools', open, insets: safeInsets() });
}
$('tune').addEventListener('click', () => { if (sceneReady) setTune(!tuneOpen); });

/* ---------- the lock (scenographic: only a salted fingerprint of the password lives here) ---------- */
function sha256js(text){
  const primes = []; for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
  const K = primes.map(p => Math.floor((Math.cbrt(p) % 1)*4294967296));
  const h = primes.slice(0, 8).map(p => Math.floor((Math.sqrt(p) % 1)*4294967296));
  const bytes = new TextEncoder().encode(text), bits = bytes.length*8;
  const buf = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6); buf.set(bytes); buf[bytes.length] = 0x80;
  const dv = new DataView(buf.buffer); dv.setUint32(buf.length - 8, Math.floor(bits/4294967296)); dv.setUint32(buf.length - 4, bits >>> 0);
  const w = new Uint32Array(64), rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < buf.length; o += 64){
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + 4*i);
    for (let i = 16; i < 64; i++){
      const s0 = rr(w[i-15], 7) ^ rr(w[i-15], 18) ^ (w[i-15] >>> 3), s1 = rr(w[i-2], 17) ^ rr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++){
      const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, hh].forEach((v, i) => { h[i] = (h[i] + v) >>> 0; });
  }
  return h.map(v => v.toString(16).padStart(8, '0')).join('');
}
async function sha256hex(s){
  try {
    if (window.crypto && crypto.subtle){
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return sha256js(s);
}
async function check(pw){
  const m = /salt=([^;]+);sha256=([0-9a-f]+)/.exec(document.querySelector('meta[name=bg-auth]').content);
  if (!m) return false;
  return (await sha256hex(m[1] + '\n' + pw.trim().normalize('NFC'))) === m[2];
}
/* everything behind the password lives in content.json, fetched only after the lock opens:
   the one place to swap in an encrypted file later */
let content = null;
async function loadContent(){
  if (content) return content;
  const inline = document.getElementById('content-inline');
  if (inline){ content = JSON.parse(inline.textContent); return content; }
  const r = await fetch('content.json', { cache: 'no-cache' });
  content = await r.json();
  return content;
}
function renderLinks(){
  const c = content && content[lang];
  $('links').innerHTML = c ? c.links.map(([k, v]) => `<a href="#${k}" data-panel="${k}">${v}</a>`).join('') : '';
}
async function unlock(){
  try { await loadContent(); } catch (e) {}
  renderLinks();
  document.body.classList.add('unlocked');
  try { sessionStorage.setItem('bg-auth', 'v1'); } catch (e) {}
  const first = $('links').querySelector('a'); if (first) first.focus({ preventScroll: true });
}
$('login').addEventListener('submit', async e => {
  e.preventDefault();
  if (await check($('pw').value)){ $('err').textContent = ''; $('pw').removeAttribute('aria-invalid'); unlock(); return; }
  $('err').textContent = T[lang].bad; $('pw').value = ''; $('pw').setAttribute('aria-invalid', 'true');
  const f = $('login'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
});
$('eye').addEventListener('click', () => {
  const p = $('pw'); p.type = p.type === 'password' ? 'text' : 'password';
  $('eye').setAttribute('aria-label', p.type === 'password' ? T[lang].show : T[lang].hide); p.focus();
});
$('logout').addEventListener('click', e => {
  e.preventDefault(); closePanel(); document.body.classList.remove('unlocked');
  try { sessionStorage.removeItem('bg-auth'); } catch (err) {}
  $('pw').value = ''; $('pw').focus();
});
try { if (sessionStorage.getItem('bg-auth') === 'v1') unlock(); } catch (e) {}
if (matchMedia('(pointer: fine)').matches && !document.body.classList.contains('unlocked')) $('pw').focus({ preventScroll: true });

/* ---------- cards (their content comes in the next step) ---------- */
let openKey = null, lastTrigger = null;
function renderPanel(k){
  const html = content && content[lang].panels[k]; if (!html) return;
  const body = $('panel-body'), keep = body.scrollTop;
  body.innerHTML = html;
  const h = body.querySelector('h2');
  $('panel-title').textContent = h ? h.textContent : k;
  if (h) h.remove();
  body.scrollTop = keep;
}
function openPanel(k){
  if (!content || !content[lang].panels[k]) return;
  lastTrigger = document.activeElement; openKey = k; renderPanel(k);
  $('panel-body').scrollTop = 0; $('panel').classList.remove('scrolled');
  $('veil').classList.add('open'); $('panel').classList.add('open');
  $('panel').setAttribute('aria-hidden', 'false'); $('panel').removeAttribute('inert');
  $('close').focus();
}
function closePanel(){
  if (!openKey) return;
  openKey = null; $('veil').classList.remove('open'); $('panel').classList.remove('open');
  $('panel').setAttribute('aria-hidden', 'true'); $('panel').setAttribute('inert', '');
  if (lastTrigger && lastTrigger.focus) lastTrigger.focus();
}
$('links').addEventListener('click', e => {
  const a = e.target.closest('a[data-panel]'); if (!a) return;
  e.preventDefault(); openPanel(a.dataset.panel);
});
$('panel-body').addEventListener('scroll', () => $('panel').classList.toggle('scrolled', $('panel-body').scrollTop > 18));
$('close').addEventListener('click', closePanel); $('veil').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closePanel(); if (tuneOpen) setTune(false); } });

setLang(lang, false);
locate();
</script>
</body>
